name: Build and publish Neki APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unpack app source
        run: unzip NekiAndroid-source.zip -d project
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: project
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neki-android-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Neki APK v0.1.${{ github.run_number }}
          prerelease: true
          files: project/app/build/outputs/apk/debug/app-debug.apk
